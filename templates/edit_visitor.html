{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
        <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-lg font-bold text-white">Edit Visitor Record</h1>
                <p class="text-xs text-slate-400">Pass Code: <span class="text-indigo-400 font-mono font-bold">{{ visitor.pass_code }}</span></p>
            </div>
            <a href="{{ url_for('index') }}" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold transition border border-slate-700">
                ← Back to Dashboard
            </a>
        </div>

        <form method="POST" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Full Name</label>
                    <input type="text" name="full_name" value="{{ visitor.full_name }}" required class="w-full px-3 py-2 border border-slate-700 rounded-xl text-xs bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Category</label>
                    <select name="visitor_category" required class="w-full px-3 py-2 border border-slate-700 rounded-xl text-xs bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="Parent/Guardian" {% if visitor.visitor_category == 'Parent/Guardian' %}selected{% endif %}>Parent / Guardian</option>
                        <option value="Delivery/Courier" {% if visitor.visitor_category == 'Delivery/Courier' %}selected{% endif %}>Delivery / Courier</option>
                        <option value="Supplier" {% if visitor.visitor_category == 'Supplier' %}selected{% endif %}>Supplier</option>
                        <option value="Official Guest" {% if visitor.visitor_category == 'Official Guest' %}selected{% endif %}>Official Guest</option>
                        <option value="Maintenance" {% if visitor.visitor_category == 'Maintenance' %}selected{% endif %}>Maintenance</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Contact Number</label>
                    <input type="text" name="contact_number" value="{{ visitor.contact_number }}" required class="w-full px-3 py-2 border border-slate-700 rounded-xl text-xs bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Person To Visit</label>
                    <input type="text" name="person_to_visit" value="{{ visitor.person_to_visit }}" required class="w-full px-3 py-2 border border-slate-700 rounded-xl text-xs bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Purpose of Visit</label>
                <input type="text" name="purpose" value="{{ visitor.purpose }}" required class="w-full px-3 py-2 border border-slate-700 rounded-xl text-xs bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Vehicle Type</label>
                    <select name="vehicle_type" class="w-full px-3 py-2 border border-slate-700 rounded-xl text-xs bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="None" {% if visitor.vehicle_type == 'None' %}selected{% endif %}>Walk-in / None</option>
                        <option value="Car" {% if visitor.vehicle_type == 'Car' %}selected{% endif %}>Car</option>
                        <option value="Motorcycle" {% if visitor.vehicle_type == 'Motorcycle' %}selected{% endif %}>Motorcycle</option>
                        <option value="Van/Truck" {% if visitor.vehicle_type == 'Van/Truck' %}selected{% endif %}>Van / Truck</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Plate Number</label>
                    <input type="text" name="plate_number" value="{{ visitor.plate_number }}" class="w-full px-3 py-2 border border-slate-700 rounded-xl text-xs bg-slate-800 text-white uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div class="pt-4 flex justify-end gap-2">
                <a href="{{ url_for('index') }}" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-semibold transition border border-slate-700">Cancel</a>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-xs font-semibold transition shadow-md shadow-indigo-500/20">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
